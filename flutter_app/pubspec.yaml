name: aurcm_route
description: AURCM Route — Real-time College Bus Tracking for Anna University Regional Campus Madurai
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ─────────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ───────────────────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── HTTP Client ──────────────────────────────────────────────────────────────
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # ── Realtime / WebSockets ────────────────────────────────────────────────────
  socket_io_client: ^3.1.4

  # ── Maps ─────────────────────────────────────────────────────────────────────
  google_maps_flutter: ^2.17.0

  # ── Location / GPS ───────────────────────────────────────────────────────────
  geolocator: ^14.0.2
  permission_handler: ^11.3.1

  # ── Background Execution ─────────────────────────────────────────────────────
  flutter_background_service: ^5.0.9
  flutter_local_notifications: ^17.2.2
  wakelock_plus: ^1.2.8

  # ── Secure Storage ───────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── Local Cache ──────────────────────────────────────────────────────────────
  shared_preferences: ^2.3.2
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # ── Serialization ────────────────────────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── Network ──────────────────────────────────────────────────────────────────
  connectivity_plus: ^6.0.3

  # ── UI / Typography ──────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # ── Utilities ────────────────────────────────────────────────────────────────
  intl: ^0.19.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  logger: ^2.4.0
  timeago: ^3.7.0
  url_launcher: ^6.3.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # ── Code Generation ──────────────────────────────────────────────────────────
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  custom_lint: ^0.7.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/map_styles/
    - .env

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
